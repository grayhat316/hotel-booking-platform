<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Book Deluxe Room - Serena Hotel Nairobi</title>
    <link href="https://fonts.bunny.net/css?family=Nunito:300,400,600,700,800|Playfair+Display:400,600,700" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Nunito', sans-serif; background: #f8f9fa; }
        h1, h2, h3, h4, h5, .serif { font-family: 'Playfair Display', serif; }
        .booking-card { background: white; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); padding: 2rem; }
        .price-summary { background: #f8f9fa; border-radius: 8px; padding: 1.5rem; }
        .btn-book { background: #1a3a5c; border-color: #1a3a5c; padding: 15px 40px; font-size: 1.1rem; }
        .btn-book:hover { background: #2c5282; border-color: #2c5282; }
        .form-control, .form-select { border-radius: 8px; padding: 12px; }
        .breadcrumb-section { background: #f8f9fa; padding: 20px 0; }
        .price { color: #c9a96e; font-weight: 700; }
    </style>
</head>
<body>
    <div class="breadcrumb-section">
        <div class="container">
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a href="/">Home</a></li>
                    <li class="breadcrumb-item"><a href="/rooms">Rooms</a></li>
                    <li class="breadcrumb-item"><a href="/rooms/1">Deluxe Room</a></li>
                    <li class="breadcrumb-item active">Book Now</li>
                </ol>
            </nav>
        </div>
    </div>

    <section class="py-5">
        <div class="container">
            <div class="row">
                <div class="col-md-8">
                    <div class="booking-card">
                        <h3 class="serif mb-4">Book Deluxe Room</h3>
                        <form action="/booking/1" method="POST">
                            <input type="hidden" name="_token" value="csrf-token-placeholder">
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="guest_name" class="form-label">Full Name *</label>
                                    <input type="text" class="form-control" id="guest_name" name="guest_name" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="guest_email" class="form-label">Email Address *</label>
                                    <input type="email" class="form-control" id="guest_email" name="guest_email" required>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="guest_phone" class="form-label">Phone Number *</label>
                                    <input type="tel" class="form-control" id="guest_phone" name="guest_phone" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="guests" class="form-label">Number of Guests *</label>
                                    <select class="form-select" id="guests" name="guests" required>
                                        <option value="1">1 Guest</option>
                                        <option value="2">2 Guests</option>
                                    </select>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="check_in" class="form-label">Check-in Date *</label>
                                    <input type="date" class="form-control" id="check_in" name="check_in" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="check_out" class="form-label">Check-out Date *</label>
                                    <input type="date" class="form-control" id="check_out" name="check_out" required>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label for="special_requests" class="form-label">Special Requests</label>
                                <textarea class="form-control" id="special_requests" name="special_requests" rows="3" placeholder="Any special requirements or requests..."></textarea>
                            </div>
                            <button type="submit" class="btn btn-book text-white w-100">Submit Booking Request</button>
                        </form>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="booking-card">
                        <h5 class="serif mb-3">Booking Summary</h5>
                        <div class="price-summary mb-3">
                            <h6 class="serif">Deluxe Room</h6>
                            <p class="text-muted small mb-1">2 guests max</p>
                            <p class="price mb-0">$150 <small class="text-muted">/ night</small></p>
                        </div>
                        <hr>
                        <div class="d-flex justify-content-between mb-2">
                            <span>Room Type</span>
                            <strong>Deluxe Room</strong>
                        </div>
                        <div class="d-flex justify-content-between mb-2">
                            <span>Capacity</span>
                            <strong>2 guests</strong>
                        </div>
                        <hr>
                        <p class="text-muted small">Total will be calculated based on your stay duration.</p>
                    </div>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
