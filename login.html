<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Login — Hotel Booking</title>

    <!-- Fonts -->
    <link href="https://fonts.bunny.net/css?family=Nunito:400,600,700" rel="stylesheet">

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            font-family: 'Nunito', sans-serif;
            background-color: #f8f9fa;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            border: none;
            border-radius: 0.75rem;
            box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.1);
        }

        .login-card .card-header {
            background-color: #fff;
            border-bottom: none;
            padding: 2rem 2rem 0;
            text-align: center;
        }

        .login-card .card-body {
            padding: 1.5rem 2rem 2rem;
        }

        .brand-icon {
            color: #0d6efd;
            margin-bottom: 0.5rem;
        }

        .brand-title {
            font-weight: 700;
            color: #212529;
            margin-bottom: 0.25rem;
        }

        .brand-subtitle {
            color: #6c757d;
            font-size: 0.9rem;
            margin-bottom: 0;
        }

        .form-control:focus {
            border-color: #0d6efd;
            box-shadow: 0 0 0 0.2rem rgba(13, 110, 253, 0.25);
        }

        .btn-login {
            padding: 0.6rem;
            font-weight: 600;
        }

        .input-group-text {
            background-color: #f8f9fa;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card login-card">
            <div class="card-header">
                <i class="fas fa-hotel fa-3x brand-icon"></i>
                <h3 class="brand-title">Hotel Booking</h3>
                <p class="brand-subtitle">Sign in to your account</p>
            </div>

            <div class="card-body">
                
                
                <form method="POST" action="http://127.0.0.1:8001/login">
                    <input type="hidden" name="_token" value="miua2s2TDYXBskpMGuClrYmOGTXpGdiAB0eyojLw" autocomplete="off">
                    
                    <div class="mb-3">
                        <label for="email" class="form-label fw-semibold">Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fas fa-envelope"></i></span>
                            <input
                                type="email"
                                id="email"
                                name="email"
                                class="form-control "
                                value=""
                                placeholder="you@example.com"
                                required
                                autofocus
                            >
                        </div>
                                            </div>

                    
                    <div class="mb-3">
                        <label for="password" class="form-label fw-semibold">Password</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fas fa-lock"></i></span>
                            <input
                                type="password"
                                id="password"
                                name="password"
                                class="form-control "
                                placeholder="Enter your password"
                                required
                            >
                        </div>
                                            </div>

                    
                    <div class="mb-3 form-check">
                        <input type="checkbox" class="form-check-input" id="remember" name="remember">
                        <label class="form-check-label" for="remember">Remember me</label>
                    </div>

                    
                    <div class="d-grid mb-3">
                        <button type="submit" class="btn btn-primary btn-login">
                            <i class="fas fa-sign-in-alt me-1"></i> Sign In
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
